<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6f9;--card:#fff;--tx:#1b2430;--mu:#667085;--bd:#e3e6eb;--ac:#1f6feb;--hd:#eef1f5;--side:#14213d;--sidetx:#cfd8e8;--g:#1a9f5b;--a:#d9922b;--r:#d6493f}

:root[data-theme="dark"]{--bg:#12161c;--card:#1b212a;--tx:#e8ecf1;--mu:#9aa5b4;--bd:#2c3440;--ac:#5b9bff;--hd:#232b36;--side:#0c1017;--sidetx:#aab4c4}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
aside{background:var(--side);color:var(--sidetx);padding:18px 12px;position:sticky;top:0;height:100vh;align-self:start}
.logo{font-weight:700;color:#fff;font-size:16px;padding:4px 10px 16px}.logo small{display:block;font-weight:400;color:var(--sidetx);font-size:11px}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:10px 12px;border-radius:8px;cursor:pointer;margin-bottom:2px}
nav button:hover{background:rgba(255,255,255,.07)}nav button.on{background:var(--ac);color:#fff}
main{padding:20px;min-width:0}h1{font-size:22px;margin:0}.sub{color:var(--mu);font-size:12px;margin:2px 0 14px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
select,input{padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit;min-width:0}
input{flex:1;min-width:160px}.btn{padding:8px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);cursor:pointer;font:inherit}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}.kpis .card{margin:0}
.k{color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.05em}.v{font-size:20px;font-weight:650;margin-top:2px}
h2{font-size:15px;margin:0 0 10px}.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.g2 .card{margin:0}
.row{display:grid;grid-template-columns:140px 1fr 96px;gap:10px;align-items:center;padding:5px 0}
.track{background:var(--hd);border-radius:6px;height:12px;overflow:hidden;display:flex}.fill{height:100%}
.num{text-align:right;font-variant-numeric:tabular-nums}.mu{color:var(--mu);font-size:12px}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:680px;font-size:13px}

td.num,th.num{text-align:right}tr.cl{cursor:pointer}tr.cl:hover td{background:var(--hd)}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;color:#fff;white-space:nowrap}
.empty{padding:24px;text-align:center;color:var(--mu)}

th.sp{color:#fff}.sr>td{background:var(--hd);padding:12px 16px}.sr table{min-width:0;width:auto;font-size:12px;background:var(--card)}

:root[data-theme="light"]{--bg:#e8f3fc;--card:#fff;--tx:#12304d;--mu:#5b7a96;--bd:#cfe4f6;--ac:#1e88e5;--hd:#e1effb;--side:#dcedfb;--sidetx:#2d5a85}
body{background:linear-gradient(180deg,#d6eafb 0,#eef6fd 340px,#eef6fd)}

.logo{color:#0d47a1}nav button:hover{background:rgba(30,136,229,.12)}nav button.on{background:linear-gradient(90deg,#1e88e5,#42a5f5);box-shadow:0 4px 10px rgba(30,136,229,.35)}

.card{border-radius:14px;box-shadow:0 4px 14px rgba(30,136,229,.10);animation:up .5s both}.card:hover{box-shadow:0 8px 22px rgba(30,136,229,.18)}
